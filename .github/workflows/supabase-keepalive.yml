# Second filet contre la mise en pause du projet Supabase (plan gratuit :
# pause après ~7 jours sans requête API).
#
# Le cron Vercel (vercel.json → /api/keepalive) est le mécanisme principal.
# Ce workflow existe parce qu'un cron Vercel peut être désactivé sans bruit
# (dépassement de quota Hobby, projet déconnecté, déploiement en échec).
#
# ⚠️ Limite connue : GitHub désactive les workflows planifiés d'un dépôt resté
# 60 jours sans activité. Il envoie un mail avant — il suffit de le réactiver.
#
# Configuration (Settings du dépôt) :
#   - Variables > KEEPALIVE_URL   (optionnel) URL de la route keepalive
#   - Secrets > CRON_SECRET       (optionnel) si vous en avez défini un sur Vercel
#   - Secrets > SUPABASE_URL + SUPABASE_ANON_KEY (optionnel) pour le ping direct

name: Supabase keepalive

on:
  schedule:
    # Tous les 3 jours à 07:00 UTC — large marge sous le seuil de 7 jours
    - cron: '0 7 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    # Le contexte `secrets` est interdit dans un `if:` (erreur de compilation
    # « Unrecognized named-value: 'secrets' » → workflow entier invalide, aucun
    # job créé). On le recopie donc en env de job : `env` y est autorisé, et
    # `env` est lisible depuis un `if:` de step.
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - name: Ping /api/keepalive (via Vercel)
        env:
          # Domaine de production réel. neighborshare-liard.vercel.app est un
          # ancien alias qui redirige (307) vers celui-ci.
          KEEPALIVE_URL: ${{ vars.KEEPALIVE_URL || 'https://voisinsducedre.vercel.app/api/keepalive' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          auth=()
          if [ -n "${CRON_SECRET:-}" ]; then
            auth=(-H "Authorization: Bearer ${CRON_SECRET}")
          fi
          echo "GET ${KEEPALIVE_URL}"
          code=$(curl -sS -o /tmp/keepalive.json -w '%{http_code}' \
                   --retry 3 --retry-delay 10 --max-time 30 \
                   "${auth[@]}" "${KEEPALIVE_URL}")
          cat /tmp/keepalive.json; echo
          if [ "$code" != "200" ]; then
            echo "::error::keepalive a répondu $code"
            exit 1
          fi

      - name: Ping direct PostgREST (indépendant de Vercel)
        if: ${{ env.SUPABASE_ANON_KEY != '' && env.SUPABASE_URL != '' }}
        run: |
          set -euo pipefail

          # Normalisation défensive des secrets. Une valeur collée depuis
          # .env.local embarque facilement le préfixe `NEXT_PUBLIC_SUPABASE_URL=`,
          # des guillemets ou un retour à la ligne — curl sort alors un cryptique
          # « URL rejected: Port number was not a decimal number » (il ne voit
          # plus `https` comme un schéma). GitHub masquant la valeur dans les
          # logs, on ne peut pas l'inspecter : on la valide donc explicitement.
          url=$(printf '%s' "${SUPABASE_URL}" | tr -d '\r\n')
          url="${url#*=}"           # tolère un préfixe « VAR= »
          url=$(printf '%s' "$url" | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//; s/^["'"'"'](.*)["'"'"']$/\1/; s#/+$##')
          key=$(printf '%s' "${SUPABASE_ANON_KEY}" | tr -d '\r\n' | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//; s/^["'"'"'](.*)["'"'"']$/\1/')

          if ! printf '%s' "$url" | grep -qE '^https://[A-Za-z0-9.-]+$'; then
            echo "::error::Secret SUPABASE_URL invalide : une origine nue est attendue, du type https://<ref>.supabase.co (sans préfixe NEXT_PUBLIC_…=, sans guillemets, sans chemin ni slash final)."
            exit 1
          fi

          code=$(curl -sS -o /dev/null -w '%{http_code}' \
                   --retry 3 --retry-delay 10 --max-time 30 \
                   -H "apikey: ${key}" \
                   -H "Authorization: Bearer ${key}" \
                   "${url}/rest/v1/categories?select=id&limit=1")
          echo "PostgREST → $code"
          if [ "$code" != "200" ]; then
            echo "::error::PostgREST a répondu $code"
            exit 1
          fi
